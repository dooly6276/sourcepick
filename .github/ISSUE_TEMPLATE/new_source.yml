name: Suggest a source
description: A site that belongs in a built-in source, a dead site to remove, or a new source or region.
title: "Source: "
labels: ["source"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Sources are plain JSON files in `lenses/`. If you are comfortable editing one, a pull request is even faster: see CONTRIBUTING.md.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - Add sites to an existing source
        - Remove or fix a site
        - New source
        - New region or country
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Which source? (for example "Forums" or kr-community)
  - type: textarea
    id: sites
    attributes:
      label: Sites
      description: One per line. Domains or URL paths, for example `reddit.com/r/BuyItForLife`.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do they belong?
      description: What do people find there that search engines bury? First-hand posts, reviews, primary sources...
    validations:
      required: true
